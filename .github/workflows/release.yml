name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/ZipXP.App/ZipXP.App.csproj -getProperty:Version --nologo).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match project version $version." }
      - name: Build and run checks
        shell: pwsh
        run: |
          dotnet build ZipXP.slnx --nologo -warnaserror
          dotnet run --project tests/ZipXP.Checks/ZipXP.Checks.csproj --no-build
      - name: Publish package
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Verify package install and uninstall
        shell: pwsh
        run: ./scripts/package-check.ps1
      - name: Name the asset and write its checksum
        shell: pwsh
        run: |
          Move-Item artifacts/win-x64.zip artifacts/ZipXP-win-x64.zip
          $hash = (Get-FileHash artifacts/ZipXP-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii artifacts/ZipXP-win-x64.zip.sha256 "$hash  ZipXP-win-x64.zip`n"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/ZipXP-win-x64.zip
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' artifacts/ZipXP-win-x64.zip artifacts/ZipXP-win-x64.zip.sha256 `
            --title '${{ github.ref_name }}' --generate-notes `
            --notes 'Unsigned build. Install with the one-line command in docs/install.md, or extract the ZIP and run install.ps1.'
